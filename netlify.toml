[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  # 20 tripped `npm warn EBADENGINE ... required: { node: '>=22.0.0' }` on every
  # build — a dependency now requires 22. Kept in step with `.nvmrc`.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Serve the Apple App Site Association file (webcredentials → iOS Password
# AutoFill "Save Password" prompt) as JSON. The file is extensionless, so its
# content-type must be set explicitly.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[dev]
  command = "npm run dev"
  targetPort = 3000
