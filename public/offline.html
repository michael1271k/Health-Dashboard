<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HELIX — Reconnecting</title>
<!--
  ── THE PAGE THAT EXISTS SO THE SCREEN IS NEVER BLACK ────────────────────────

  The native shell loads a remote url. When iOS kills the backgrounded webview
  content process, Capacitor reloads that url; if the reload cannot reach the
  network, `WebViewDelegationHandler` falls back to `server.errorPath` — and
  before this file existed, there was no errorPath, so it painted nothing over
  `ios.backgroundColor: #0A0B0D`.

  It is deliberately self-contained: no chunks, no fonts, no service worker, no
  script imports. It has to render when nothing else can.
-->
<style>
  :root { color-scheme: dark }
  * { box-sizing: border-box }
  html, body { margin: 0; height: 100% }
  body {
    background: radial-gradient(ellipse at 50% 0%, #121418 0%, #0A0B0D 60%);
    color: #ECEEF2;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    text-align: center;
  }
  .stack { display: flex; flex-direction: column; align-items: center; gap: 18px; max-width: 320px }
  .mark { font-size: 15px; font-weight: 700; letter-spacing: 0.3em; color: #E0703C; animation: pulse 1.6s ease-in-out infinite }
  h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: -0.01em }
  p { font-size: 14px; line-height: 1.5; margin: 0; color: #79808C }
  button {
    -webkit-appearance: none; appearance: none;
    min-height: 44px; padding: 0 22px; border-radius: 12px;
    background: rgba(224,112,60,0.12); border: 1px solid rgba(224,112,60,0.35);
    color: #E0703C; font-size: 15px; font-weight: 600; font-family: inherit;
    transition: transform 120ms ease-out;
  }
  button:active { transform: scale(0.97) }
  @keyframes pulse { 0%,100% { opacity: 0.45 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .mark { animation: none; opacity: 1 } }
</style>
</head>
<body>
  <div class="stack">
    <div class="mark">HELIX</div>
    <h1>Reconnecting</h1>
    <p>The connection dropped while the app was in the background. Your session is saved on this device — nothing was lost.</p>
    <button type="button" id="retry">Try again</button>
  </div>
<script>
  // Where to go back to. The shell's origin is not this file's origin (this one
  // is loaded from the bundle), so the target is spelled out — and it aims at
  // the logger, because that is the screen you were on when this appeared.
  var HOME = 'https://helix-health-fitness.netlify.app';
  document.getElementById('retry').addEventListener('click', function () {
    location.replace(HOME + '/session');
  });
  // Come back on its own the moment the network does, so a pocket-length outage
  // needs no tap at all.
  window.addEventListener('online', function () { location.replace(HOME + '/session'); });
</script>
</body>
</html>
